name: jenkins

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    user: root
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    environment:
      TZ: Asia/Kolkata

    volumes:
      - cloud-native-enterprise-infrastructure-monitoring-log-management-automation-platform_jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro

volumes:
  cloud-native-enterprise-infrastructure-monitoring-log-management-automation-platform_jenkins-data:
    external: true
