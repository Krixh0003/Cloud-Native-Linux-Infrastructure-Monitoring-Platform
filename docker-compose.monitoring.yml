name: cloud-native-enterprise-infrastructure-monitoring-log-management-automation-platform

services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ${PROMETHEUS_CONTAINER}
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    environment:
      TZ: ${TZ}

    ports:
      - "${PROMETHEUS_PORT}:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./docker/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - prometheus-data:/prometheus

    networks:
      - monitoring


  grafana:
    image: grafana/grafana:12.2.0
    container_name: ${GRAFANA_CONTAINER}
    restart: unless-stopped

    depends_on:
      - prometheus
      - loki

    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

    ports:
      - "${GRAFANA_PORT}:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

    networks:
      - monitoring


  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ${ALERTMANAGER_CONTAINER}
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      TZ: ${TZ}

    ports:
      - "${ALERTMANAGER_PORT}:9093"

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    networks:
      - monitoring


  loki:
    image: grafana/loki:3.5.5
    container_name: ${LOKI_CONTAINER}
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    environment:
      TZ: ${TZ}

    ports:
      - "${LOKI_PORT}:3100"

    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: ${BLACKBOX_CONTAINER}
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    ports:
      - "${BLACKBOX_PORT}:9115"

    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    networks:
      - monitoring


  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    ports:
      - "9100:9100"

    command:
      - '--path.rootfs=/host'

    pid: host

    volumes:
      - '/:/host:ro,rslave'

    networks:
      - monitoring



  promtail:
    image: grafana/promtail:3.5.5
    container_name: promtail
    restart: unless-stopped

    depends_on:
      - loki

    command:
      - "-config.file=/etc/promtail/config.yml"

    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge


volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  jenkins-data:
